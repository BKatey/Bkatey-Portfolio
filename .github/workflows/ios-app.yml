# Builds the iOS app from crossword/ using the Capacitor project in mobile-app/.
#
# - On every push or pull request: checks the app builds (for the iOS Simulator; no Apple account needed).
# - Run manually with "Upload to TestFlight" ticked: signs the app and sends it to TestFlight so it can be
#   installed on real iPhones and iPads. This needs an Apple Developer account and the repository secrets
#   listed in mobile-app/README.md.
name: iOS app

on:
  push:
    paths:
      - "crossword/**"
      - "mobile-app/**"
      - ".github/workflows/ios-app.yml"
  pull_request:
    paths:
      - "crossword/**"
      - "mobile-app/**"
      - ".github/workflows/ios-app.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload to TestFlight (needs the Apple secrets)"
        type: boolean
        default: false

jobs:
  build-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install Capacitor
        run: npm ci

      - name: Copy the web app into the iOS project
        run: npm run build && npx cap sync ios

      - name: Build for the iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip the simulator app
        run: ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/App.app spelling-games-ios-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: spelling-games-ios-simulator-app
          path: mobile-app/spelling-games-ios-simulator.zip
          if-no-files-found: error

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build-simulator
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - name: Check the Apple secrets are set
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See mobile-app/README.md, section 'iPhone and iPad app'."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install Capacitor
        run: npm ci

      - name: Copy the web app into the iOS project
        run: npm run build && npx cap sync ios

      - name: Save the App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive (signed automatically with the API key)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
