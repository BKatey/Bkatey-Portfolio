# Builds the Android app (an installable .apk) from crossword/ using the Capacitor project in mobile-app/.
# Download it from the run's "Artifacts" section.
name: Android app

on:
  push:
    paths:
      - "crossword/**"
      - "mobile-app/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "crossword/**"
      - "mobile-app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install Capacitor
        run: npm ci

      - name: Copy the web app into the Android project
        run: npm run build && npx cap sync android

      - name: Build the APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: spelling-games-android-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
